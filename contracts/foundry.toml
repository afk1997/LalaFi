[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "../config" },
  { access = "read-write", path = "../deployments" },
  { access = "read", path = "../fixtures" },
  { access = "read", path = "./out" }
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

# Acceptance profile (PRD 1.4 #5): >= 1,000,000 calls per invariant.
# runs * depth = 1,000,000
[profile.deep.invariant]
runs = 7813
depth = 128
fail_on_revert = false

[profile.deep.fuzz]
runs = 100000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
